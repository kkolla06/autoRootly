[pytest]
markers =
    smoke: P0 smoke checks — must pass on every build
    landing: landing screen flows
    login: authentication flows (email/password, SSO, Google, Slack, Create Account, logout)
    home: home dashboard flows
    incident: incident lifecycle flows
    alerts: alerts and notifications flows
    shifts: shifts / schedules flows
    settings: settings screen flows
    navigation: cross-screen navigation
    e2e: end-to-end critical path scenarios
    edge: edge cases and negative tests
    p0: priority 0 — smoke
    p1: priority 1 — critical
    p2: priority 2 — important
    p3: priority 3 — edge / boundary

log_cli = true
log_cli_level = INFO
addopts = -v --tb=long --html=output/report.html --css=assets/custom_report.css
